sonar.projectKey=mahdaf_shopping-list
sonar.organization=mahdaf

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=shopping-list
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src/components,src/hooks
sonar.tests=src/__tests__
sonar.test.inclusions=src/__tests__/**/*.[jt]s?(x),src/**/*.test.[jt]s?(x)
sonar.exclusions=src/__tests__/**/*.[jt]s?(x),src/**/*.test.[jt]s?(x),**/__mocks__/**,**/node_modules/**,**/public/**

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8 

# Branch configuration for analysis
sonar.branch.name = staging
sonar.branch.target = main

# Path to coverage report (LCOV)
sonar.javascript.lcov.reportPaths=./coverage/lcov.info